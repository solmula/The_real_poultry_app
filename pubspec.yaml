name: poultry_automation
description: Poultry House Automation System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0

  # State Management
  provider: ^6.1.0

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  intl: ^0.18.0
  flutter_local_notifications: ^17.2.0
  shared_preferences: ^2.0.0
  connectivity_plus: ^6.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true